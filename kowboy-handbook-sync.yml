# Kowboy handbook sync. Copy this file to .github/workflows/kowboy-handbook-sync.yml in a project.
# Once a day, and on demand from the Actions tab ("Run workflow"), it brings the project's copy of the
# handbook up to date with the main branch of KowboyMedia/kowboy-handbook and commits the change
# straight to the project's default branch.
#
# Two jobs, so the script fetched from the handbook never runs with a token that can push:
# "prepare" runs it with read access only; "commit" takes just the three handbook paths and pushes.
name: kowboy-handbook-sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.sync.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: sync
        run: |
          git clone --quiet --depth 1 --branch main https://github.com/KowboyMedia/kowboy-handbook.git "$RUNNER_TEMP/kowboy-handbook"
          echo "version=$(git -C "$RUNNER_TEMP/kowboy-handbook" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          bash "$RUNNER_TEMP/kowboy-handbook/kowboy-handbook-sync.sh" "$RUNNER_TEMP/kowboy-handbook" .
          mkdir "$RUNNER_TEMP/out"
          cp -L AGENTS.md CLAUDE.md "$RUNNER_TEMP/out/"
          cp -R kowboy-handbook-phases "$RUNNER_TEMP/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: kowboy-handbook
          path: ${{ runner.temp }}/out

  commit:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: kowboy-handbook
          path: ${{ runner.temp }}/out
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          case "$VERSION" in *[!0-9a-f]* | "") echo "kowboy-handbook-sync: bad version '$VERSION'"; exit 1 ;; esac
          cat "$RUNNER_TEMP/out/AGENTS.md" > AGENTS.md
          [ CLAUDE.md -ef AGENTS.md ] || cat "$RUNNER_TEMP/out/CLAUDE.md" > CLAUDE.md
          rm -rf kowboy-handbook-phases
          cp -R "$RUNNER_TEMP/out/kowboy-handbook-phases" kowboy-handbook-phases
          git add AGENTS.md CLAUDE.md kowboy-handbook-phases
          if git diff --cached --quiet; then
            echo "kowboy-handbook-sync: already up to date with handbook $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Sync Kowboy handbook to KowboyMedia/kowboy-handbook@$VERSION"
          git push
          echo "kowboy-handbook-sync: committed handbook $VERSION"
