name: Sync shared agent files
on:
  push:
    branches: [main]
    paths: [AGENTS-shared.md, PLAYBOOK.md, template/**, .github/sync.yml]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_TOKEN }} # fine-grained token: Contents, Workflows and Pull requests read and write, Metadata read, on the repositories in sync.yml
          SKIP_PR: true
          COMMIT_EACH_FILE: false
          COMMIT_PREFIX: 'Shared agent files:'
