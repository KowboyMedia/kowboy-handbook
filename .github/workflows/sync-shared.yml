name: Sync shared agent files
on:
  push:
    branches: [main]
    paths: [AGENTS-shared.md, template/**, .github/sync.yml]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_TOKEN }} # a token with contents, workflows and pull-request write on the target repositories
          COMMIT_EACH_FILE: false
          COMMIT_PREFIX: 'Shared agent files:'
          PR_LABELS: agents
