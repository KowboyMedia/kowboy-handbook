# Runs the acceptance tests on every pull request and on every change to main.
# main requires this check to pass before a merge.
name: kowboy-handbook-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: kowboy-handbook-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: bash tests/kowboy-handbook-sync.test.sh
