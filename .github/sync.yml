# The copy path, for repositories that need the files themselves (a repository read by agents
# other than Claude, or one where the plugin is not on). Which files reach which repositories, and
# into which branch. On every change here the action saves the files straight into that branch (no
# approval click per repository: the change was approved here, where these files are protected). A
# repository with a staging branch receives them there, so they reach live with its next release;
# one without receives them on main. Add a repository by adding its line; remove it by deleting it.
group:
  - files:
      - source: plugins/kowboy-handbook/KOWBOY-HANDBOOK.md
        dest: KOWBOY-HANDBOOK.md
      - source: plugins/kowboy-handbook/PLAYBOOK.md
        dest: PLAYBOOK.md
      - source: plugins/kowboy-handbook/hooks/context.sh
        dest: .claude/hooks/context.sh
      - source: plugins/kowboy-handbook/hooks/turn.sh
        dest: .claude/hooks/turn.sh
      - source: plugins/kowboy-handbook/hooks/format.sh
        dest: .claude/hooks/format.sh
      - source: plugins/kowboy-handbook/hooks/stop.sh
        dest: .claude/hooks/stop.sh
      - source: plugins/kowboy-handbook/skills/
        dest: .claude/skills/
      - source: plugins/kowboy-handbook/template/
        dest: .handbook/template/
      - source: plugins/kowboy-handbook/template/scripts/check-register.mjs
        dest: scripts/check-register.mjs
    repos: |
      KowboyMedia/kowboy-core@staging
